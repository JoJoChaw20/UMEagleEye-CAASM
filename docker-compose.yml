services:
  postgres:
    image: postgres:16-alpine
    container_name: umeagleeye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umeagleeye_db}
      POSTGRES_USER: ${POSTGRES_USER:-umeagleeye_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-S4cr3tP8ssw0rd}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: umeagleeye-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
